[package]
name = "taskgeneral-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api"
path = "main.rs"

[dependencies]
taskgeneral-server = { path = "../server" }
taskgeneral-core = { git = "https://github.com/Rohanator2314/taskgeneral-core.git" }
vercel_runtime = { version = "2", features = ["axum"] }
axum = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

